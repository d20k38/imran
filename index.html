<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İmran Dosya Merkezi</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}:root{--c:#fff;--b:#e2e8f0;--m:#64748b;--a:#2563eb;--s:#eff6ff}body.dark{background:#0f172a;color:#f8fafc;--c:#1e293b;--b:#334155;--m:#94a3b8;--s:#172554}
header{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;padding:28px 20px}.wrap{max-width:1200px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:14px;align-items:center}.brandicon{font-size:34px}.brand h1{font-size:23px;margin:0 0 4px}.brand p{margin:0;opacity:.85;font-size:13px}.theme,.refresh{border:0;border-radius:10px;padding:10px 13px;cursor:pointer}.theme{background:#ffffff22;color:#fff}.refresh{background:var(--a);color:#fff}
main{padding:26px 20px}.toolbar{display:flex;gap:10px;background:var(--c);border:1px solid var(--b);padding:14px;border-radius:15px}input,select{background:var(--c);color:inherit;border:1px solid var(--b);border-radius:10px;padding:11px 13px}input{flex:1}.breadcrumb{margin:17px 0;color:var(--m);font-size:14px}.crumb{color:var(--a);cursor:pointer}.sep{margin:0 7px}.status{padding:11px 14px;border-radius:10px;background:var(--s);color:var(--m);font-size:13px;margin-bottom:18px}.title{display:flex;justify-content:space-between;margin:18px 0 12px}.title h2{font-size:19px;margin:0}.count{font-size:13px;color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px}.card{background:var(--c);border:1px solid var(--b);border-radius:15px;padding:18px;position:relative}.icon{font-size:38px;margin-bottom:11px}.name{font-size:15px;font-weight:700;word-break:break-word}.meta{font-size:12px;color:var(--m);margin:7px 0 14px;line-height:1.45}.actions{display:flex}.btn{display:block;width:100%;text-align:center;text-decoration:none;border-radius:9px;padding:8px;font-size:12px;cursor:pointer;border:1px solid var(--b);background:var(--c);color:inherit}.primary{background:var(--a);border-color:var(--a);color:#fff}.new{position:absolute;right:12px;top:12px;background:#16a34a;color:#fff;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:bold}.empty{text-align:center;color:var(--m);padding:55px 10px}footer{text-align:center;color:var(--m);font-size:12px;padding:30px}
@media(max-width:650px){.toolbar{flex-direction:column}.grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="wrap head"><div class="brand"><div class="brandicon">📁</div><div><h1>İmran Dosya Merkezi</h1><p>imrann.neocities.org</p></div></div><button class="theme" onclick="theme()">🌙</button></div></header>
<main class="wrap"><div class="toolbar"><input id="q" placeholder="🔎 Dosya ara..." oninput="render()"><select id="f" onchange="render()"><option value="all">Tümü</option><option value="folder">📁 Klasörler</option><option value="pdf">📕 PDF</option><option value="image">🖼 Görseller</option><option value="html">🌐 HTML</option><option value="other">📄 Diğer</option></select><button class="refresh" onclick="load()">🔄 Yenile</button></div>
<div id="bc" class="breadcrumb"></div><div id="status" class="status">Dosya listesi yükleniyor…</div><div class="title"><h2 id="ttl">📁 Ana Dizin</h2><span id="cnt" class="count"></span></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>🔍<br>Dosya bulunamadı.</div></main><footer>Otomatik Neocities dosya listesi · <span id="updated"></span></footer>
<script>
const DATA="/files.json", imgs=["jpg","jpeg","png","gif","webp","svg","ico","avif"];let all=[],cur="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ext=p=>(p.split(".").pop()||"").toLowerCase();
function typ(f){if(f.is_directory)return"folder";let e=ext(f.path);if(e==="pdf")return"pdf";if(imgs.includes(e))return"image";if(["html","htm"].includes(e))return"html";return"other"}
function ico(t){return({folder:"📁",pdf:"📕",image:"🖼️",html:"🌐",other:"📄"})[t]}
function size(n){if(!n)return"";if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";return(n/1048576).toFixed(1)+" MB"}
function url(p){return"/"+p.split("/").map(encodeURIComponent).join("/")}
function go(p){cur=p;document.getElementById("q").value="";render()}
function bread(){let a=cur?cur.split("/"):[],h='<span class="crumb" onclick="go('')">🏠 Ana Dizin</span>',p="";a.forEach(x=>{p+=(p?"/":"")+x;h+='<span class="sep">/</span><span class="crumb" onclick="go('+JSON.stringify(p)+')">'+esc(x)+'</span>'});document.getElementById("bc").innerHTML=h;document.getElementById("ttl").textContent=a.length?"📁 "+a[a.length-1]:"📁 Ana Dizin"}
function render(){bread();let pre=cur?cur+"/":"",q=document.getElementById("q").value.toLowerCase().trim(),fl=document.getElementById("f").value;let list=all.filter(x=>x.path.startsWith(pre)&&x.path.slice(pre.length)&&!x.path.slice(pre.length).includes("/")).filter(x=>(!q||x.path.toLowerCase().includes(q))&&(fl==="all"||typ(x)===fl));list.sort((a,b)=>(a.is_directory?-1:1)-(b.is_directory?-1:1)||a.path.localeCompare(b.path,"tr"));document.getElementById("cnt").textContent=list.length+" öğe";document.getElementById("empty").hidden=!!list.length;let g=document.getElementById("grid");g.innerHTML="";list.forEach(x=>{let t=typ(x),n=x.path.split("/").pop(),fresh=x.updated_at&&Date.now()-new Date(x.updated_at).getTime()<7*864e5;g.innerHTML+=`<div class="card">${fresh?'<span class="new">YENİ</span>':''}<div class="icon">${ico(t)}</div><div class="name">${esc(n)}</div><div class="meta">${esc(x.is_directory?"Klasör":[t.toUpperCase(),size(x.size),x.updated_at||""].filter(Boolean).join(" • "))}</div><div class="actions">${x.is_directory?`<button class="btn primary" onclick='go(${JSON.stringify(x.path)})'>İçine gir</button>`:`<a class="btn primary" href="${url(x.path)}" target="_blank" rel="noopener">Aç</a>`}</div></div>`})}
async function load(){document.getElementById("status").textContent="Neocities dosya listesi güncelleniyor…";try{let r=await fetch(DATA+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;let d=await r.json();all=d.files||[];document.getElementById("status").textContent="Liste güncellendi.";document.getElementById("updated").textContent="Son liste: "+(d.generated_at||"bilinmiyor");render()}catch(e){document.getElementById("status").textContent="files.json alınamadı. GitHub Actions'ı kontrol edin.";render()}}
function theme(){document.body.classList.toggle("dark");localStorage.setItem("imran-theme",document.body.classList.contains("dark")?"dark":"light")}if(localStorage.getItem("imran-theme")==="dark")document.body.classList.add("dark");load();
</script></body></html>

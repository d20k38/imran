name: Neocities Dosya Listesini Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Neocities dosya listesini al
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: |
          set -e

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${NEOCITIES_API_KEY}" \
            "https://neocities.org/api/list" \
            -o neocities-response.json

      - name: files.json oluştur
        run: |
          python3 scripts/build_files_json.py \
            neocities-response.json \
            files.json

      - name: files.json değiştiyse GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add files.json

          if git diff --cached --quiet; then
            echo "Dosya listesinde değişiklik yok."
          else
            git commit -m "Neocities dosya listesini güncelle"
            git push
          fi

      - name: files.json dosyasını Neocities'e gönder
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: |
          set -e

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${NEOCITIES_API_KEY}" \
            -F "files.json=@files.json" \
            "https://neocities.org/api/upload"
